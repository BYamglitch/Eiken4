o cut vegetables safely.","Mina practiced every Tuesday after school.","In June, she made curry for her family.","Her father said it was delicious, and Mina was very happy."],"qs":[{"q":"When did Mina join the cooking club?","opts":["In April","In May","In June","In July"],"a":0,"evidence":0},{"q":"What was difficult for Mina at first?","opts":["Making curry","Using a kitchen knife","Going to school","Buying vegetables"],"a":1,"evidence":1},{"q":"Why was Mina happy?","opts":["She bought a new knife","Her father liked her curry","The club ended early","She did not practice"],"a":1,"evidence":5}],"timeline":["joined the cooking club","learned to cut vegetables safely","practiced every Tuesday","made curry for her family"]}];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], rnd=n=>Math.floor(Math.random()*n), shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}, sample=(a,n)=>shuffle(a).slice(0,n);
const LS='eiken4_oni_v1'; function load(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch{return {}}} function save(x){localStorage.setItem(LS,JSON.stringify(x))};
function logWeak(app,key,ok){const d=load();d.weak=d.weak||{};const k=app+'|'+key;const z=d.weak[k]||{w:0,c:0};ok?z.c++:z.w++;d.weak[k]=z;save(d)}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1200)}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function show(html){$('#home').classList.add('hidden');$('#screen').classList.remove('hidden');$('#screen').innerHTML=html} function home(){$('#screen').classList.add('hidden');$('#screen').innerHTML='';$('#home').classList.remove('hidden')}
function shell(title,body){return `<div class="topline"><button class="back" onclick="home()">← 戻る</button><span class="pill">${title}</span></div>${body}`}
$$('[data-go]').forEach(b=>b.onclick=()=>({past:startPast,vocab:vocabMenu,phrase:phraseApp,grammar:grammarMenu,reading:readingMenu}[b.dataset.go]()))

function startPast(){
 let cats=['語彙','文法','会話','語句整序']; let q=[]; cats.forEach(c=>q.push(...sample(PAST.filter(x=>x.cat===c),c==='語句整序'?4:c==='会話'?5:7))); while(q.length<24) q.push(...sample(PAST.filter(x=>!q.includes(x)),1));
 // six reading questions cover notice/email/expository every turn
 const rs=sample(READINGS,2); rs.forEach(r=>r.qs.slice(0,3).forEach(z=>q.push({type:'reading',cat:r.kind,q:z.q,opts:z.opts,a:z.a,jp:'',passage:r}))); q=shuffle(q).slice(0,30); runQuiz('過去問 1ターン30問',q,'past');
}
function runQuiz(title,items,app){let i=0,score=0,wrong=[]; function render(){if(i>=items.length)return finish(); const x=items[i];show(shell(title,`<div class="row"><span class="pill">${i+1} / ${items.length}</span><span class="weak">正解 ${score}</span></div><div class="progress"><i style="width:${100*i/items.length}%"></i></div>${x.type==='reading'?`<div class="passage"><b>${x.passage.title}</b><br>${x.passage.text.join('<br>')}</div>`:''}<div class="card"><div class="small">${x.cat||''}</div><div class="qtitle">${x.q}</div>${x.type==='order'?orderUI(x):mcUI(x)}</div>`)); bind(x)}
 function mcUI(x){return `<div class="options">${x.opts.map((o,j)=>`<button class="opt" data-a="${j}">${j+1}. ${o}</button>`).join('')}</div>${x.jp?`<div class="row" style="margin-top:12px"><button class="secondary" id="jp">日本語訳を見る</button></div><div id="jpbox" class="result hidden">${x.jp}</div>`:''}`}
 function orderUI(x){return `<div class="answerbox" id="built"></div><div class="alpha">${shuffle(x.words).map(w=>`<button class="letter" style="width:auto;padding:0 13px" data-word="${w}">${w}</button>`).join('')}</div><div class="row"><button class="secondary" id="reset">やり直す</button><button class="primary" id="checkOrder">決定</button></div>`}
 function bind(x){if($('#jp')) $('#jp').onclick=()=>$('#jpbox').classList.toggle('hidden'); if(x.type==='order'){let built=[];$$('[data-word]').forEach(b=>b.onclick=()=>{built.push(b.dataset.word);b.disabled=true;$('#built').textContent=built.join(' ')});$('#reset').onclick=()=>{built=[];$$('[data-word]').forEach(b=>b.disabled=false);$('#built').textContent=''};$('#checkOrder').onclick=()=>judge(built.join(' ').toLowerCase()===x.answer.toLowerCase(),x.answer)}else $$('[data-a]').forEach(b=>b.onclick=()=>judge(+b.dataset.a===x.a,x.opts[x.a],b))}
 function judge(ok,ans,btn){if(btn)btn.classList.add(ok?'ok':'ng');if(ok){score++;toast('○ 正解');logWeak(app,items[i].q,true)}else{wrong.push(items[i]);toast('× 正解：'+ans);logWeak(app,items[i].q,false)}setTimeout(()=>{i++;render()},650)}
 function finish(){show(shell(title,`<div class="card"><div class="small">終了</div><div class="score">${score} / ${items.length}</div><p>誤答 ${wrong.length}問。復習は点数に含めません。</p><div class="row"><button class="primary" id="again">もう1ターン</button>${wrong.length?'<button class="secondary" id="review">誤答だけ復習</button>':''}</div></div>`));$('#again').onclick=()=>app==='past'?startPast():home(); if($('#review'))$('#review').onclick=()=>runQuiz(title+'・復習',wrong,'review')} render()}

function vocabMenu(){show(shell('単語',`<div class="menu"><button class="menubtn" id="fall">🎮 落ちゲー</button><button class="menubtn" id="spell">🔤 アルファベットタップ</button><button class="menubtn" id="meaning">🇯🇵 英→日4択</button><button class="menubtn" id="weak">⚠️ 苦手4択</button></div><p class="sub">英検4級単語データから出題。音声は端末の英語音声を使用します。</p>`));$('#fall').onclick=fallGame;$('#spell').onclick=spellGame;$('#meaning').onclick=()=>wordMC(false);$('#weak').onclick=()=>wordMC(true)}
function wordMC(weakOnly=false){let bank=WORDS; if(weakOnly){const d=load().weak||{};const ww=WORDS.filter(x=>(d['word|'+x.en]?.w||0)>(d['word|'+x.en]?.c||0));if(ww.length>=4)bank=ww;else toast('苦手が4語未満なので全範囲から出題')}let items=sample(bank,20).map(x=>({cat:'単語',q:`${x.en} <button class="speak" onclick="event.stopPropagation();speak('${x.en.replaceAll("'","\'")}')">🔊</button>`,opts:shuffle([x.ja,...sample(WORDS.filter(y=>y.en!==x.en),3).map(y=>y.ja)]),target:x}));items.forEach(z=>z.a=z.opts.indexOf(z.target.ja));runQuiz('単語 英→日 20問',items,'word')}
function spellGame(){let pool=sample(WORDS.filter(x=>/^[A-Za-z]+$/.test(x.en)&&x.en.length>=3&&x.en.length<=12),20),i=0,score=0,mist=[];function r(){if(i>=pool.length)return done();let x=pool[i],letters=shuffle(x.en.toLowerCase().split('')),built='';show(shell('アルファベットタップ',`<div class="row"><span class="pill">${i+1} / 20</span><button class="speak" id="sp">🔊 発音</button></div><div class="card"><div class="qtitle">${x.ja}</div><div class="answerbox" id="built"></div><div class="alpha">${letters.map((l,k)=>`<button class="letter" data-k="${k}">${l}</button>`).join('')}</div><div class="small">間違えたら全部リセット。</div></div>`));$('#sp').onclick=()=>speak(x.en);$$('[data-k]').forEach(b=>b.onclick=()=>{built+=b.textContent;b.disabled=true;$('#built').textContent=built;if(!x.en.toLowerCase().startsWith(built)){mist.push(x);toast('× リセット');built='';$$('[data-k]').forEach(z=>z.disabled=false);$('#built').textContent='';logWeak('spell',x.en,false)}else if(built===x.en.toLowerCase()){score++;logWeak('spell',x.en,true);toast('○ '+x.en);setTimeout(()=>{i++;r()},500)}})}function done(){show(shell('アルファベットタップ',`<div class="card"><div class="score">${score} / 20</div><p>スペルを最後まで完成できた語数です。</p><button class="primary" onclick="spellGame()">もう1回</button></div>`))}r()}
function fallGame(){let score=0,left=60,cur=null,y=-60,timer,fallTimer;const bank=WORDS;show(shell('60秒 落ち単語',`<div class="row"><span class="pill">残り <b id="time">60</b>秒</span><span class="pill">正解 <b id="score">0</b></span></div><div class="fallbox"><div id="fallword" class="fallword"></div></div><div id="fallopts" class="options"></div>`));function next(){cur=bank[rnd(bank.length)];y=-65;$('#fallword').textContent=cur.en;let opts=shuffle([cur.ja,...sample(bank.filter(z=>z.en!==cur.en),3).map(z=>z.ja)]);$('#fallopts').innerHTML=opts.map(o=>`<button class="opt">${o}</button>`).join('');$$('#fallopts .opt').forEach(b=>b.onclick=()=>{if(b.textContent===cur.ja){score++;$('#score').textContent=score;logWeak('word',cur.en,true);toast('○');next()}else{logWeak('word',cur.en,false);toast('×')}})}next();fallTimer=setInterval(()=>{y+=1.3;$('#fallword').style.top=y+'px';if(y>350){logWeak('word',cur.en,false);next()}},20);timer=setInterval(()=>{left--;$('#time').textContent=left;if(left<=0){clearInterval(timer);clearInterval(fallTimer);show(shell('60秒 落ち単語',`<div class="card"><div class="score">${score}語</div><p>60秒終了。</p><button class="primary" onclick="fallGame()">もう1回</button></div>`))}},1000)}

function phraseApp(){let items=sample(PHRASES,20).map(x=>{let opts=shuffle([x.ja,...sample(PHRASES.filter(y=>y.en!==x.en),3).map(y=>y.ja)]);return {cat:'熟語',q:`${x.en} <button class="speak" onclick="event.stopPropagation();speak('${x.en.replaceAll("'","\'")}')">🔊</button>`,opts,a:opts.indexOf(x.ja),jp:''}});runQuiz('熟語 英→日 20問',items,'phrase')}
function grammarMenu(){let cats=[...new Set(GRAMMAR.map(x=>x.cat))];show(shell('文法',`<div class="tabs"><button class="tab sel" data-cat="all">全範囲</button>${cats.map(c=>`<button class="tab" data-cat="${c}">${c}</button>`).join('')}</div><div class="card" style="margin-top:12px"><p class="sub">市販テキストの問題をカテゴリ別に練習。最初は英語だけを見て、必要なときに「日本語訳を見る」。</p><button class="primary" id="gstart">20問スタート</button></div>`));let cat='all';$$('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;$$('[data-cat]').forEach(z=>z.classList.toggle('sel',z===b))});$('#gstart').onclick=()=>{let bank=cat==='all'?GRAMMAR:GRAMMAR.filter(x=>x.cat===cat);let items=sample(bank,Math.min(20,bank.length)).map(x=>({...x,type:'mc'}));runGrammar(items)}}
function runGrammar(items){let i=0,score=0,wrong=[];function r(){if(i>=items.length)return done();let x=items[i];show(shell('文法',`<div class="row"><span class="pill">${i+1} / ${items.length}</span><span class="pill">${x.cat}</span></div><div class="card"><div class="small">${x.src}</div><div class="qtitle">${x.q}</div><div class="sub">${x.prompt}</div><div class="options">${x.opts.map((o,j)=>`<button class="opt" data-a="${j}">${j+1}. ${o}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="secondary" id="jp">日本語訳を見る</button></div><div id="jpbox" class="result hidden">${x.jp}</div></div>`));$('#jp').onclick=()=>$('#jpbox').classList.toggle('hidden');$$('[data-a]').forEach(b=>b.onclick=()=>{let ok=+b.dataset.a===x.a;b.classList.add(ok?'ok':'ng');if(ok)score++;else wrong.push(x);logWeak('grammar',x.q,ok);toast(ok?'○ 正解':'× 正解：'+x.opts[x.a]);setTimeout(()=>{i++;r()},650)})}function done(){show(shell('文法',`<div class="card"><div class="score">${score} / ${items.length}</div><p>誤答 ${wrong.length}問</p>${wrong.length?'<button class="secondary" id="rv">誤答だけ復習</button>':''} <button class="primary" onclick="grammarMenu()">範囲選択へ</button></div>`));if($('#rv'))$('#rv').onclick=()=>runGrammar(wrong)}r()}

function readingMenu(){show(shell('読解ラボ',`<div class="menu"><button class="menubtn" data-rm="exam">本番型</button><button class="menubtn" data-rm="evidence">証拠文タップ</button><button class="menubtn" data-rm="info">Who / When / Where / What</button><button class="menubtn" data-rm="timeline">時系列並べ替え</button><button class="menubtn wide" data-rm="filter">不要情報を消せ</button></div><p class="sub">説明文・Eメール・手紙・掲示を「答える」だけでなく、「根拠を探す」読み方にします。</p>`));$$('[data-rm]').forEach(b=>b.onclick=()=>readingRun(b.dataset.rm))}
function readingRun(mode){const r=READINGS[rnd(READINGS.length)];if(mode==='exam'){let items=r.qs.map(z=>({type:'reading',cat:r.kind,q:z.q,opts:z.opts,a:z.a,passage:r}));return runQuiz('読解・本番型',items,'reading')}if(mode==='evidence')return evidence(r);if(mode==='info')return infoMode(r);if(mode==='timeline')return timelineMode(r);return filterMode(r)}
function evidence(r){let q=r.qs[rnd(r.qs.length)],picked=null;show(shell('証拠文タップ',`<div class="card"><div class="qtitle">${q.q}</div><p class="sub">答えの根拠になる1文をタップ。</p><div class="passage">${r.text.map((t,i)=>`<span class="line tap" data-line="${i}">${t}</span>`).join('')}</div></div>`));$$('[data-line]').forEach(b=>b.onclick=()=>{picked=+b.dataset.line;$$('[data-line]').forEach(z=>z.classList.remove('hit'));b.classList.add('hit');let ok=picked===q.evidence;toast(ok?'○ そこが根拠':'もう一度探そう');logWeak('reading-evidence',q.q,ok)})}
function infoMode(r){let inf=r.info||{Who:'本文から確認',When:'本文から確認',Where:'本文から確認',What:'本文から確認'};show(shell('Who / When / Where / What',`<div class="passage"><b>${r.title}</b><br>${r.text.join('<br>')}</div><div class="infoGrid">${Object.keys(inf).map(k=>`<button class="infoCell" data-info="${k}"><b>${k}</b><div class="small">タップして確認</div></button>`).join('')}</div>`));$$('[data-info]').forEach(b=>b.onclick=()=>{b.innerHTML=`<b>${b.dataset.info}</b><div>${inf[b.dataset.info]}</div>`})}
function timelineMode(r){if(!r.timeline)return readingRun('timeline');let ans=[...r.timeline],cur=[];show(shell('時系列並べ替え',`<div class="passage">${r.text.join('<br>')}</div><div class="answerbox" id="tl"></div><div class="options">${shuffle(ans).map(x=>`<button class="opt" data-t="${x}">${x}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="primary" id="tlcheck">決定</button></div>`));$$('[data-t]').forEach(b=>b.onclick=()=>{cur.push(b.dataset.t);b.disabled=true;$('#tl').textContent=cur.map((x,i)=>`${i+1}. ${x}`).join(' → ')});$('#tlcheck').onclick=()=>{let ok=JSON.stringify(cur)===JSON.stringify(ans);toast(ok?'○ 正解':'× もう一度');logWeak('reading-timeline',r.title,ok)}}
function filterMode(r){let q=r.qs[rnd(r.qs.length)],needed=new Set([q.evidence]);show(shell('不要情報を消せ',`<div class="card"><div class="qtitle">${q.q}</div><p class="sub">答えに直接必要でない文をタップして薄くしてください。最後に「判定」。</p><div class="passage">${r.text.map((t,i)=>`<span class="line tap" data-line="${i}">${t}</span>`).join('')}</div><button class="primary" id="fcheck">判定</button></div>`));$$('[data-line]').forEach(b=>b.onclick=()=>b.classList.toggle('dim'));$('#fcheck').onclick=()=>{let keep=$$('[data-line]').filter(b=>!b.classList.contains('dim')).map(b=>+b.dataset.line);let ok=keep.includes(q.evidence)&&keep.length<=2;toast(ok?'○ 必要情報を絞れた':'根拠文は残そう');logWeak('reading-filter',q.q,ok)}}
</script></body></html>

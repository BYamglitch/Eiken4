function fallGame(){let score=0,left=60,cur=null,y=-60,timer,fallTimer,answered=false;const bank=WORDS;show(shell('60秒 落ち単語',`<div class="row"><span class="pill">残り <b id="time">60</b>秒</span><span class="pill">正解 <b id="score">0</b></span><button class="speak" id="fallSpeak">🔊 今の単語を聞く</button></div><div class="fallbox"><div id="fallword" class="fallword"></div></div><div id="fallopts" class="options"></div>`));$('#fallSpeak').onclick=()=>cur&&speak(cur.en);function rec(ok){if(answered)return;answered=true;logWeak('fall',cur.en,ok,{rec:'fall',cat:'単語の意味',prompt:cur.en,answer:cur.ja})}function next(){cur=bank[rnd(bank.length)];answered=false;y=-65;$('#fallword').textContent=cur.en;let opts=shuffle([cur.ja,...sample(bank.filter(z=>z.en!==cur.en),3).map(z=>z.ja)]);$('#fallopts').innerHTML=opts.map(o=>`<button class="opt">${o}</button>`).join('');$$('#fallopts .opt').forEach(b=>b.onclick=()=>{if(b.textContent===cur.ja){score++;$('#score').textContent=score;rec(true);toast('○');next()}else{rec(false);toast('×')}})}next();fallTimer=setInterval(()=>{y+=1.3;$('#fallword').style.top=y+'px';if(y>350){rec(false);next()}},20);timer=setInterval(()=>{left--;$('#time').textContent=left;if(left<=0){clearInterval(timer);clearInterval(fallTimer);rememberSession('fall',score,null);if(completeRecommendedTurn('fall'))return;show(shell('60秒 落ち単語',`<div class="card"><div class="score">${score}語</div><p>60秒終了。</p><div class="row"><button class="primary" onclick="fallGame()">もう1回</button><button class="secondary" onclick="weakLog()">苦手ログを見る</button></div></div>`))}},1000)}

function runGrammar(items,isReview=false){let i=0,score=0,wrong=[];function r(){if(i>=items.length)return done();let x=items[i];show(shell('文法',`<div class="row"><span class="pill">${i+1} / ${items.length}</span><span class="pill">${x.cat}</span></div><div class="card"><div class="small">${x.src}</div><div class="qtitle">${x.q}</div><div class="sub">${x.prompt}</div><div class="options">${x.opts.map((o,j)=>`<button class="opt" data-a="${j}">${j+1}. ${o}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="secondary" id="jp">日本語訳を見る</button></div><div id="jpbox" class="result hidden">${x.jp}</div></div>`));$('#jp').onclick=()=>$('#jpbox').classList.toggle('hidden');$$('[data-a]').forEach(b=>b.onclick=()=>{let ok=+b.dataset.a===x.a;b.classList.add(ok?'ok':'ng');if(ok)score++;else wrong.push(x);logWeak('grammar',x.q,ok,{rec:'grammar',cat:x.cat,prompt:x.q,answer:x.opts[x.a]});toast(ok?'○ 正解':'× 正解：'+x.opts[x.a]);setTimeout(()=>{i++;r()},650)})}function done(){rememberSession('grammar',score,items.length,{review:isReview});if(completeRecommendedTurn('grammar'))return;show(shell('文法',`<div class="card"><div class="score">${score} / ${items.length}</div><p>誤答 ${wrong.length}問</p><div class="row">${wrong.length?'<button class="secondary" id="rv">誤答だけ復習</button>':''}<button class="primary" onclick="grammarMenu()">範囲選択へ</button><button class="secondary" onclick="weakLog()">苦手ログを見る</button></div></div>`));if($('#rv'))$('#rv').onclick=()=>runGrammar(wrong,true)}r()}

function runChunks(items,selectedCat='all'){
 let i=0,score=0,wrong=[];
 function render(){
  if(i>=items.length)return finish();
  let x=items[i],picked=[],firstTry=true,end=x.end||'.',fullEn=x.full||x.en.join(' ')+end;
  show(shell('英文チャンク',`<div class="row"><span class="pill">${i+1} / ${items.length}</span><span class="pill">${x.cat}</span><span class="weak">正解 ${score}</span></div><div class="progress"><i style="width:${100*i/items.length}%"></i></div><div class="card"><div class="small">次の日本語を英文にする</div><div class="qtitle" id="jpPrompt">${markedJapanese(x,picked)}</div><div class="small">英文チャンクを正しい語順に並べる（正しい位置なら日本語が色づきます）</div><div class="chunk-answer"><div class="chunk-built" id="cbuilt"></div><span class="chunk-punct">${end}</span></div><div class="chunk-pool">${shuffle(x.en.map((text,id)=>({text,id}))).map(z=>`<button class="chunk-piece" data-ci="${z.id}">${z.text}</button>`).join('')}</div><div class="row"><button class="secondary" id="cundo">1つ戻す</button><button class="secondary" id="creset">全部やり直す</button><button class="primary" id="ccheck">決定</button></div><div id="cfeedback" class="result hidden"></div></div>`));
  function paint(){
   $('#cbuilt').innerHTML=picked.map(id=>`<button class="chunk-piece chosen" data-picked="${id}">${x.en[id]}</button>`).join('');
   $('#jpPrompt').innerHTML=markedJapanese(x,picked);
   $$('[data-ci]').forEach(b=>b.disabled=picked.includes(+b.dataset.ci));
   $$('[data-picked]').forEach(b=>b.onclick=()=>{let pos=picked.indexOf(+b.dataset.picked);picked.splice(pos,1);paint()})
  }
  $$('[data-ci]').forEach(b=>b.onclick=()=>{picked.push(+b.dataset.ci);paint()});
  $('#cundo').onclick=()=>{picked.pop();paint()};
  $('#creset').onclick=()=>{picked=[];paint()};
  $('#ccheck').onclick=()=>{
   if(picked.length!==x.en.length)return toast('すべての英文チャンクを並べよう');
   let ok=picked.every((id,j)=>id===j);
   if(ok){
    if(firstTry)score++;
    if(firstTry)logWeak('chunk',fullEn,true,{rec:'chunk',cat:x.cat,prompt:x.ja.join(''),answer:fullEn});toast('○ 正解');
    $('#cfeedback').classList.remove('hidden');
    $('#cfeedback').innerHTML=`<div class="row"><b>完成英文：</b><button class="speak" id="canswerSpeak">🔊 全文を聞く</button></div><div class="qtitle">${fullEn}</div><div class="chunk-map">${x.en.map((z,j)=>`<div><b>${z}</b> → ${x.map[j]}</div>`).join('')}</div><button class="primary" id="cnext" style="margin-top:12px">次へ</button>`;
    $('#canswerSpeak').onclick=()=>speak(fullEn);$('#cnext').onclick=()=>{i++;render()}
   }else{
    if(firstTry){wrong.push(x);logWeak('chunk',fullEn,false,{rec:'chunk',cat:x.cat,prompt:x.ja.join(''),answer:fullEn})}firstTry=false;
    toast('× 英文の語順を見直そう');$('#cfeedback').classList.remove('hidden');
    $('#cfeedback').innerHTML='<b>ヒント：</b>黄色にならないチャンクは、置く位置を見直そう。'
   }
  };
  paint()
 }
 function finish(){
  rememberSession('chunk',score,items.length);if(completeRecommendedTurn('chunk'))return;show(shell('英文チャンク',`<div class="card"><div class="small">10問ドリル終了</div><div class="score">${score} / ${items.length}</div><p>初回で正解できなかった問題：${wrong.length}問</p><div class="row"><button class="primary" id="cagain">もう1ターン</button>${wrong.length?'<button class="secondary" id="creview">誤答だけ復習</button>':''}<button class="secondary" onclick="chunkMenu()">範囲選択へ</button><button class="secondary" onclick="weakLog()">苦手ログを見る</button></div></div>`));
  $('#cagain').onclick=()=>{let bank=selectedCat==='all'?CHUNKS:CHUNKS.filter(x=>x.cat===selectedCat);runChunks(sample(bank,Math.min(10,bank.length)),selectedCat)};
  if($('#creview'))$('#creview').onclick=()=>runChunks(wrong,selectedCat)
 }
 render()
}

function weakKeysFor(ids){const d=load();return Object.entries(d.weak||{}).filter(([k,z])=>ids.includes(recFromStoredKey(k,z))&&(z.w||0)>(z.c||0)).sort((a,b)=>((b[1].w||0)-(b[1].c||0))-((a[1].w||0)-(a[1].c||0))).map(([k])=>k.split('|').slice(1).join('|'))}
